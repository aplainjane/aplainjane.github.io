<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web 3D Figure Showcase</title>
    
    <style>
      /* --- 全局深空背景 --- */
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #050508; 
        background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 80%);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      /* --- 画布容器：圆角矩形悬浮窗 --- */
      #tuanjie-container {
        position: relative;
        width: 85vw;
        max-width: 1280px;
        aspect-ratio: 16 / 9; /* 保持宽屏比例 */
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
        background: #000;
      }

      #tuanjie-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        outline: none;
      }

      /* --- 高级感 Loading 界面 --- */
      #tuanjie-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }
      .loading-text {
        color: #fff;
        font-size: 12px;
        letter-spacing: 4px;
        margin-bottom: 12px;
        opacity: 0.7;
      }
      #tuanjie-progress-bar-empty {
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #tuanjie-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #00ffcc;
        box-shadow: 0 0 10px #00ffcc;
        transition: width 0.2s ease;
      }

      /* --- 左侧滑出 Tips 提示框 (毛玻璃特效) --- */
      #tips-panel {
        position: fixed;
        left: -400px; /* 初始隐藏在屏幕左侧外 */
        top: 50%;
        transform: translateY(-50%);
        width: 280px;
        padding: 24px;
        background: rgba(20, 20, 30, 0.6);
        backdrop-filter: blur(12px); /* 毛玻璃模糊 */
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0 16px 16px 0; /* 右边圆角 */
        box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
        color: #e0e0e0;
        transition: left 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); /* 丝滑弹出曲线 */
        z-index: 100;
      }

      /* 触发弹出的类名 */
      #tips-panel.show {
        left: 0;
      }

      .tips-title {
        font-size: 16px;
        font-weight: bold;
        color: #00ffcc;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      /* 关闭按钮 */
      .close-btn {
        cursor: pointer;
        color: #888;
        font-size: 14px;
        transition: 0.3s;
      }
      .close-btn:hover { color: #fff; }

      .tips-content {
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 20px;
        color: #bbb;
      }
      .tips-content span {
        color: #fff;
        font-weight: bold;
        background: rgba(255,255,255,0.1);
        padding: 2px 6px;
        border-radius: 4px;
        margin: 0 2px;
      }

      /* 下载按钮 */
      .download-btn {
        display: block;
        text-align: center;
        padding: 10px 0;
        background: linear-gradient(135deg, #00ffcc, #00b3ff);
        color: #000;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
        border-radius: 8px;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
      }

      #tuanjie-warning { display: none; }
    </style>
  </head>
  <body>
    
    <div id="tips-panel">
      <div class="tips-title">
        交互指南 & 说明
        <div class="close-btn" onclick="closeTips()">✕</div>
      </div>
      <div class="tips-content">
        欢迎体验！你可以使用鼠标自由拖拽关节。<br><br>
        💡 <b>换装操作：</b> 按键盘 <span>1</span> 或 <span>2</span> 可褪去/穿上外套或裙子。<br><br>
        ⚠️ <b>技术说明：</b> 受限于 WebGL 浏览器环境对多线程物理演算的底层限制，当前网页版本已关闭 MagicaCloth 布料实时解算。
      </div>
      <a href="zips/电子手办.zip" class="download-btn" target="_blank">📥 下载完整版 (含物理效果)</a>
    </div>

    <div id="tuanjie-container">
      <canvas id="tuanjie-canvas" tabindex="-1"></canvas>
      
      <div id="tuanjie-loading-bar">
        <div class="loading-text">INITIALIZING ENGINE...</div>
        <div id="tuanjie-progress-bar-empty">
          <div id="tuanjie-progress-bar-full"></div>
        </div>
      </div>
    </div>
  
    <script>
      var canvas = document.querySelector("#tuanjie-canvas");
      var loadingBar = document.querySelector("#tuanjie-loading-bar");
      var progressBarFull = document.querySelector("#tuanjie-progress-bar-full");
      var tipsPanel = document.querySelector("#tips-panel");

      // 关闭 Tips 弹窗的函数
      function closeTips() {
        tipsPanel.classList.remove("show");
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        dataUrl: buildUrl + "/Build.data",
        frameworkUrl: buildUrl + "/Build.framework.js",
        codeUrl: buildUrl + "/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "KY's model",
        productName: "3Dmodel",
        productVersion: "0.1",
        showBanner: function(msg, type) { console.log(type + ": " + msg); },
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createTuanjieInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((tuanjieInstance) => {
          // 加载完成后，隐藏加载条
          loadingBar.style.display = "none";
          
          // 核心交互：模型加载完毕后，延迟 1.5 秒，从左边丝滑弹出 Tips 框
          setTimeout(() => {
            tipsPanel.classList.add("show");
          }, 1500);

        }).catch((message) => {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
