<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集 | 去远方</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 80px 20px 40px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.6;
    }

    .back-link {
      position: fixed;
      top: 24px;
      left: 24px;
      color: #667eea;
      text-decoration: none;
      font-size: 0.95rem;
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 100;
    }

    .back-link:hover { opacity: 1; }

    .grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 32px rgba(102, 126, 234, 0.2);
    }

    .card-img {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1e1e30, #2a2a4a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .card-body {
      padding: 20px;
    }

    .card-body h3 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .card-body p {
      font-size: 0.9rem;
      line-height: 1.6;
      opacity: 0.6;
      margin-bottom: 16px;
    }

    .card-tags span {
      display: inline-block;
      padding: 3px 10px;
      margin-right: 6px;
      margin-bottom: 6px;
      font-size: 0.75rem;
      border-radius: 20px;
      background: rgba(102, 126, 234, 0.15);
      color: #667eea;
    }

    .card-link {
      display: inline-block;
      margin-top: 12px;
      color: #667eea;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .card-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <a class="back-link" href="/">&larr; Back</a>

  <header>
    <h1>My Portfolio</h1>
    <p>Here are some of my works</p>
  </header>

  <div class="grid">

    <!-- 作品卡片示例 - 复制修改即可添加更多 -->
    <div class="card">
      <div class="card-img">🚀</div>
      <div class="card-body">
        <h3>示例项目</h3>
        <p>这是一个示例项目卡片，替换为你自己的作品描述。</p>
        <div class="card-tags">
          <span>HTML</span>
          <span>CSS</span>
          <span>JavaScript</span>
        </div>
        <a class="card-link" href="#">查看详情 &rarr;</a>
      </div>
    </div>

  </div>

</body>
</html>
